<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading Activity</title>
    <style>
        /* CSS Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2,
        h3 {
            color: #2c3e50;
        }

        .config-section-title {
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
        }

        /* Page Visibility Variables */
        #config-page,
        #activity-page {
            display: none;
        }

        #config-page.active,
        #activity-page.active {
            display: block;
        }

        /* Configuration Styles */
        .config-option {
            margin: 10px 0;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #7f8c8d;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background-color: #636e72;
        }

        /* Activity Page Layout */
        .top-nav {
            padding: 15px;
            background: #ecf0f1;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .workspace {
            display: flex;
            gap: 20px;
        }

        .left-panel,
        .right-panel {
            flex: 1;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-flex h2 {
            margin: 0;
        }

        .paragraph-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-top: 15px;
            padding: 15px;
            background: #fff;
            border-radius: 4px;
            border: 1px dashed #ccc;
        }

        /* Form Elements */
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }

        .aspect-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        select,
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="range"] {
            width: 200px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ================== CONFIGURATION PAGE ================== -->
        <div id="config-page" class="active">
            <h1>Activity Configuration</h1>

            <h3 class="config-section-title">Navigation Method</h3>
            <p style="margin-top:0;">Select how reviewers will navigate between students:</p>
            <div class="config-option">
                <input type="radio" id="nav-dropdown" name="nav-method" value="dropdown" checked>
                <label for="nav-dropdown"><strong>Drop-down Menu:</strong> Select a student from a list.</label>
            </div>
            <div class="config-option">
                <input type="radio" id="nav-scrollbar" name="nav-method" value="scrollbar">
                <label for="nav-scrollbar"><strong>Scroll-bar (Slider):</strong> Drag a slider to find the
                    student.</label>
            </div>
            <div class="config-option">
                <input type="radio" id="nav-text" name="nav-method" value="text">
                <label for="nav-text"><strong>Text Entry:</strong> Type the exact student name (e.g., "Student
                    5").</label>
            </div>
            <div class="config-option">
                <input type="radio" id="nav-button" name="nav-method" value="button">
                <label for="nav-button"><strong>Next Button:</strong> Simple button to proceed to the next
                    student.</label>
            </div>

            <h3 class="config-section-title">Visibility Settings</h3>
            <div class="config-option">
                <label><strong>Default Writing Sample Visibility:</strong> </label>
                <input type="radio" id="vis-visible" name="default-visibility" value="visible" checked>
                <label for="vis-visible">Visible</label>
                <input type="radio" id="vis-hidden" name="default-visibility" value="hidden" style="margin-left: 15px;">
                <label for="vis-hidden">Hidden</label>
            </div>

            <h3 class="config-section-title">Workflow Settings</h3>
            <div class="config-option">
                <label><strong>Auto-advance on Submit:</strong> </label>
                <input type="radio" id="auto-on" name="auto-advance" value="on">
                <label for="auto-on">On</label>
                <input type="radio" id="auto-off" name="auto-advance" value="off" checked style="margin-left: 15px;">
                <label for="auto-off">Off</label>
            </div>

            <button onclick="startActivity()"
                style="margin-top: 25px; width: 100%; font-size: 1.1em; padding: 15px;">Start Activity</button>
        </div>

        <!-- ================== ACTIVITY PAGE ================== -->
        <div id="activity-page">
            <!-- Top Section: Dynamic Navigation -->
            <div class="top-nav" id="top-nav-container">
                <!-- Navigation controls injected here via JS -->
            </div>

            <!-- Split Workspace -->
            <div class="workspace">

                <!-- Left Side: Generated Paragraph -->
                <div class="left-panel">
                    <div class="header-flex">
                        <h2>Writing Sample</h2>
                        <button id="toggle-visibility-btn" class="btn-secondary" onclick="toggleVisibility()">Hide
                            Sample</button>
                    </div>
                    <h3 id="current-student-title">Student 1</h3>
                    <div id="writing-sample" class="paragraph-text">
                        <!-- Sentences injected here via JS -->
                    </div>
                </div>

                <!-- Right Side: Grading Interface -->
                <div class="right-panel">
                    <h2>Evaluation</h2>

                    <label for="written-feedback"><strong>Written Feedback:</strong></label>
                    <textarea id="written-feedback"
                        placeholder="Enter comments about the writing sample here..."></textarea>

                    <div id="aspects-container">
                        <!-- Dropdowns injected here via JS -->
                    </div>

                    <button onclick="submitEvaluation()"
                        style="width: 100%; margin-top: 10px; background-color: #27ae60;">Submit Evaluation</button>
                    <button onclick="downloadCSV()"
                        style="width: 100%; margin-top: 10px; background-color: #8e44ad;">Download Submissions
                        (CSV)</button>
                    <button onclick="resetToConfig()"
                        style="width: 100%; margin-top: 10px; background-color: #95a5a6;">Back to Configuration</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ================== JAVASCRIPT ================== -->
    <script>
        const TOTAL_STUDENTS = 30;
        let currentStudent = 1;
        let currentNavMethod = 'dropdown';
        let defaultVisibility = 'visible';
        let autoAdvance = false;

        // In-memory array to store all submission data. Will wipe on page reload/navigation.
        let submissionsData = [];

        // --- TEXT GENERATION VARIABLES & FUNCTIONS ---
        const SUBJECT = ["cat", "dog", "pig", "fish", "mouse", "monkey", "bird", "parrott"];
        const VERBS_ACT = ["ate", "consumed", "licked", "pulled", "climbed", "watched", ""];
        const VERBS_PASS = ["eaten", "consumed", "licked", "pulled", "climbed", "watched"];
        const OBJECT = ["soup", "porridge", "food", "kibble", "tree", "ball", "string", "toy", "plate", "bowl", "cup"];

        function shuffleArray(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function activeGenerator(o, s, v) {
            let verbStr = v ? `${v} ` : "";
            return `The ${s} ${verbStr}the ${o}.`;
        }

        function passiveGenerator(o, s, v) {
            return `The ${o} was ${v} by the ${s}.`;
        }

        function storyGenerator(numSentences = 5) {
            let subjects = shuffleArray(SUBJECT);
            let activeVerbs = shuffleArray(VERBS_ACT);
            let passiveVerbs = shuffleArray(VERBS_PASS);
            let objects = shuffleArray(OBJECT);

            let paragraph = [];
            for (let i = 0; i < numSentences; i++) {
                let AorP = Math.random() < 0.5 ? "a" : "p";
                let sentence = "";

                if (AorP === "a") {
                    sentence = activeGenerator(objects[i], subjects[i], activeVerbs[i]);
                } else {
                    sentence = passiveGenerator(objects[i], subjects[i], passiveVerbs[i]);
                }
                paragraph.push(sentence);
            }
            return paragraph;
        }
        // ---------------------------------------------

        // 1. Initialize the page
        window.onload = function () {
            buildGradingAspects();
        };

        // 2. Transition from Config to Activity
        function startActivity() {
            const navRadios = document.getElementsByName('nav-method');
            for (let radio of navRadios) {
                if (radio.checked) {
                    currentNavMethod = radio.value;
                    break;
                }
            }

            const visRadios = document.getElementsByName('default-visibility');
            for (let radio of visRadios) {
                if (radio.checked) {
                    defaultVisibility = radio.value;
                    break;
                }
            }

            const autoRadios = document.getElementsByName('auto-advance');
            for (let radio of autoRadios) {
                if (radio.checked) {
                    autoAdvance = (radio.value === 'on');
                    break;
                }
            }

            currentStudent = 1;

            document.getElementById('config-page').classList.remove('active');
            document.getElementById('activity-page').classList.add('active');

            buildNavigation();
            updateWorkspace();
        }

        // 3. Go back to config
        function resetToConfig() {
            document.getElementById('activity-page').classList.remove('active');
            document.getElementById('config-page').classList.add('active');
        }

        // 4. Build the chosen Top Navigation
        function buildNavigation() {
            const navContainer = document.getElementById('top-nav-container');
            navContainer.innerHTML = '';

            let html = `<strong>Select Student: </strong>`;

            if (currentNavMethod === 'dropdown') {
                html += `<select id="nav-control" onchange="changeStudent(this.value)">`;
                for (let i = 1; i <= TOTAL_STUDENTS; i++) {
                    html += `<option value="${i}">Student ${i}</option>`;
                }
                html += `</select>`;
            }
            else if (currentNavMethod === 'scrollbar') {
                html += `<input type="range" id="nav-control" min="1" max="${TOTAL_STUDENTS}" value="${currentStudent}" oninput="changeStudent(this.value)">
                     <span id="slider-label" style="min-width: 80px; font-weight:bold;">Student ${currentStudent}</span>`;
            }
            else if (currentNavMethod === 'text') {
                html += `<input type="text" id="nav-control" placeholder="e.g. Student 5" onkeypress="handleTextEnter(event)">
                     <button onclick="checkTextMatch()">Go</button>
                     <span id="text-error" class="error-msg" style="margin-left: 10px;">Must match "Student X"</span>`;
            }
            else if (currentNavMethod === 'button') {
                html += `<span style="font-weight:bold; min-width:80px; margin-right:15px;">Student <span id="btn-label">${currentStudent}</span></span>
                     <button onclick="nextStudent()">Next Student &#8594;</button>`;
            }

            navContainer.innerHTML = html;
        }

        // 5. Handle Navigation Interactions
        function changeStudent(studentNum) {
            currentStudent = parseInt(studentNum);
            updateWorkspace();
        }

        function nextStudent() {
            if (currentStudent < TOTAL_STUDENTS) {
                currentStudent++;
                updateWorkspace();
            } else {
                alert("You have reached the last student.");
            }
        }

        function handleTextEnter(event) {
            if (event.key === 'Enter') {
                checkTextMatch();
            }
        }

        function checkTextMatch() {
            const inputVal = document.getElementById('nav-control').value.trim();
            const errorMsg = document.getElementById('text-error');

            const match = inputVal.match(/^student\s+(\d+)$/i);

            if (match && match[1]) {
                let num = parseInt(match[1]);
                if (num >= 1 && num <= TOTAL_STUDENTS) {
                    errorMsg.style.display = 'none';
                    currentStudent = num;
                    updateWorkspace();
                    return;
                }
            }
            errorMsg.style.display = 'inline-block';
        }

        function syncNavUI() {
            if (currentNavMethod === 'dropdown') {
                document.getElementById('nav-control').value = currentStudent;
            }
            else if (currentNavMethod === 'scrollbar') {
                document.getElementById('nav-control').value = currentStudent;
                document.getElementById('slider-label').innerText = `Student ${currentStudent}`;
            }
            else if (currentNavMethod === 'text') {
                document.getElementById('nav-control').value = `Student ${currentStudent}`;
                document.getElementById('text-error').style.display = 'none';
            }
            else if (currentNavMethod === 'button') {
                document.getElementById('btn-label').innerText = currentStudent;
            }
        }

        // 6. Update the Workspace
        function updateWorkspace() {
            syncNavUI();

            document.getElementById('current-student-title').innerText = `Student ${currentStudent}`;

            const textContainer = document.getElementById('writing-sample');
            const generatedParagraph = storyGenerator(5).join(" ");
            textContainer.innerText = generatedParagraph;

            const toggleBtn = document.getElementById('toggle-visibility-btn');
            if (defaultVisibility === 'hidden') {
                textContainer.style.display = 'none';
                toggleBtn.innerText = 'Show Sample';
            } else {
                textContainer.style.display = 'block';
                toggleBtn.innerText = 'Hide Sample';
            }

            document.getElementById('written-feedback').value = '';
            const selects = document.querySelectorAll('.aspect-select');
            selects.forEach(select => select.value = "1");
        }

        // 7. Toggle Visibility Button Logic
        function toggleVisibility() {
            const textContainer = document.getElementById('writing-sample');
            const toggleBtn = document.getElementById('toggle-visibility-btn');

            if (textContainer.style.display === 'none') {
                textContainer.style.display = 'block';
                toggleBtn.innerText = 'Hide Sample';
            } else {
                textContainer.style.display = 'none';
                toggleBtn.innerText = 'Show Sample';
            }
        }

        // 8. Generate Right Panel Dropdowns (Aspects 1-5)
        function buildGradingAspects() {
            const container = document.getElementById('aspects-container');
            let html = '';

            for (let i = 1; i <= 5; i++) {
                html += `<div class="aspect-group">
                        <label for="aspect-${i}"><strong>Aspect ${i}:</strong></label>
                        <select id="aspect-${i}" class="aspect-select">`;
                for (let score = 1; score <= 7; score++) {
                    html += `<option value="${score}">${score}</option>`;
                }
                html += `   </select>
                     </div>`;
            }
            container.innerHTML = html;
        }

        // 9. Submit Evaluation Logic
        function submitEvaluation() {
            // Collect Data
            const timestamp = new Date().toLocaleString(); // Easy to read timestamp
            const feedback = document.getElementById('written-feedback').value;
            const a1 = document.getElementById('aspect-1').value;
            const a2 = document.getElementById('aspect-2').value;
            const a3 = document.getElementById('aspect-3').value;
            const a4 = document.getElementById('aspect-4').value;
            const a5 = document.getElementById('aspect-5').value;

            // Build a record object
            const record = {
                timestamp: timestamp,
                studentNumber: currentStudent,
                navMethod: currentNavMethod,
                defaultVisibility: defaultVisibility,
                autoAdvance: autoAdvance ? "Yes" : "No",
                feedback: feedback.replace(/"/g, '""'), // Escape quotes for CSV
                aspect1: a1,
                aspect2: a2,
                aspect3: a3,
                aspect4: a4,
                aspect5: a5
            };

            // Push to memory
            submissionsData.push(record);

            // Notify user
            alert(`Evaluation for Student ${currentStudent} has been submitted successfully!`);

            // Handle Auto-Advance
            if (autoAdvance) {
                if (currentStudent < TOTAL_STUDENTS) {
                    currentStudent++;
                    updateWorkspace();
                } else {
                    alert("You have completed all student evaluations.");
                }
            }
        }

        // 10. Generate and Download CSV File
        function downloadCSV() {
            if (submissionsData.length === 0) {
                alert("No submissions to download yet.");
                return;
            }

            // Define Headers
            const headers = [
                "Timestamp",
                "Student Number",
                "Navigation Method",
                "Default Visibility",
                "Auto Advance",
                "Written Feedback",
                "Aspect 1",
                "Aspect 2",
                "Aspect 3",
                "Aspect 4",
                "Aspect 5"
            ];

            // Create CSV String
            let csvContent = headers.join(",") + "\n";

            submissionsData.forEach(row => {
                const rowData = [
                    `"${row.timestamp}"`,
                    row.studentNumber,
                    `"${row.navMethod}"`,
                    `"${row.defaultVisibility}"`,
                    `"${row.autoAdvance}"`,
                    `"${row.feedback}"`, // Wrapped in quotes to handle commas and new lines inside the text area
                    row.aspect1,
                    row.aspect2,
                    row.aspect3,
                    row.aspect4,
                    row.aspect5
                ];
                csvContent += rowData.join(",") + "\n";
            });

            // Trigger Download using a Blob
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "student_evaluations.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>

</html>
